<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>只今準備中</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f5f0e8;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    box-sizing: border-box;
  }
  .card {
    max-width: 420px;
    text-align: center;
    color: #4a4a4a;
  }
  .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 12px;
    color: #333;
  }
  p {
    font-size: 15px;
    line-height: 1.7;
    color: #666;
    margin: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="icon">🛠️</div>
    <h1>只今準備中です</h1>
    <p>この機能は現在ご利用いただけません。<br>公開まで今しばらくお待ちください。</p>
  </div>
</div>
</body>
</html>
